{% extends "base.html" %}

{% block title %}Create account – SmartBrew AI{% endblock %}

{% block content %}
<div class="page-header">
  <a class="btn-back" href="{{ url_for('customer.home') }}">‹ Back</a>
  <h1>Create account</h1>
</div>

<form class="touch-form" method="post" action="{{ url_for('auth.register') }}" novalidate>
  <label class="field">
    <span>Name</span>
    <input type="text" name="name" value="{{ form.get('name', '') }}" maxlength="80" autocomplete="name" required>
    {% if errors.name %}<span class="field-error">{{ errors.name }}</span>{% endif %}
  </label>

  <label class="field">
    <span>Email</span>
    <input type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required>
    {% if errors.email %}<span class="field-error">{{ errors.email }}</span>{% endif %}
  </label>

  <label class="field">
    <span>Password <small>(at least 8 characters)</small></span>
    <input type="password" name="password" minlength="8" autocomplete="new-password" required>
    {% if errors.password %}<span class="field-error">{{ errors.password }}</span>{% endif %}
  </label>

  <button type="submit" class="btn btn-primary btn-wide">Create account</button>
  <p class="form-hint">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</form>
{% endblock %}
