{% extends "base.html" %}

{% block title %}Not found – SmartBrew AI{% endblock %}

{% block content %}
<section class="result">
  {{ icon('espresso', 56, cls='icon-mark') }}
  <h1>Sorry, that isn't here</h1>
  <p class="subtitle">The page or drink you were looking for is not available.</p>
  <div class="result-actions">
    <a class="btn btn-primary" href="{{ url_for('customer.menu') }}">Go to the menu</a>
    <a class="btn" href="{{ url_for('customer.home') }}">{{ icon('home', 20) }}Home</a>
  </div>
</section>
{% endblock %}
